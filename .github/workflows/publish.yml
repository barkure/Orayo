name: Release

on:
  push:
    tags:
      - "v*.*.*-r*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v26.5.27-r1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish release
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      CONFIGURATION: Release
      RUNTIME_ID: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}"
          }

          if ($version -notmatch '^v\d{2}\.\d{1,2}\.\d{1,2}-r\d+$') {
            throw "Version '$version' is invalid. Use a tag like v26.5.27-r1."
          }

          $velopackVersion = $version.TrimStart('v')
          $versionParts = $velopackVersion -split '-r'
          $baseVersion = $versionParts[0]
          $releaseNumber = $versionParts[1]
          $assemblyVersion = "$baseVersion.$releaseNumber"

          "version=$version" >> $env:GITHUB_OUTPUT
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "velopack_version=$velopackVersion" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/Orayo/Orayo.csproj -r $env:RUNTIME_ID

      - name: Test core behavior
        run: dotnet test tests/Orayo.Core.Tests/Orayo.Core.Tests.csproj -c Release

      - name: Verify bundled runtime assets
        shell: pwsh
        run: |
          $requiredFiles = @(
            "src/Orayo/Assets/engine/xray.exe",
            "src/Orayo/Assets/engine/wintun.dll",
            "src/Orayo/Assets/rules/geoip.dat",
            "src/Orayo/Assets/rules/geosite.dat"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required bundled asset is missing: $file"
            }
          }

      - name: Publish
        shell: pwsh
        run: |
          ./.github/scripts/Publish-App.ps1 `
            -Configuration $env:CONFIGURATION `
            -Runtime $env:RUNTIME_ID `
            -Version '${{ steps.version.outputs.velopack_version }}' `
            -AssemblyVersion '${{ steps.version.outputs.assembly_version }}'

      - name: Download delta base package
        id: delta_base
        shell: pwsh
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool install -g vpk --version 0.0.1298
          if ($LASTEXITCODE -ne 0) { throw "Installing vpk failed." }

          vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token $env:VPK_TOKEN `
            --channel win `
            --outputDir artifacts/velopack
          if ($LASTEXITCODE -ne 0) { throw "Downloading the delta base failed." }

          $basePackages = @(Get-ChildItem artifacts/velopack/Orayo-*-full.nupkg)
          if ($basePackages.Count -ne 1) { throw "Expected exactly one previous full package." }
          "package=$($basePackages[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Create Velopack release
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $packVersion = "${{ steps.version.outputs.velopack_version }}"
          vpk pack `
            --packId Orayo `
            --packTitle Orayo `
            --packAuthors barkure `
            --packVersion $packVersion `
            --packDir artifacts/publish `
            --mainExe Orayo.exe `
            --skipVeloAppCheck `
            --runtime $env:RUNTIME_ID `
            --delta BestSpeed `
            --icon src/Orayo/Assets/icons/AppIcon.ico `
            --outputDir artifacts/velopack
          if ($LASTEXITCODE -ne 0) { throw "Creating the release failed." }

      - name: Verify delta reconstruction
        shell: pwsh
        env:
          DELTA_BASE_PACKAGE: ${{ steps.delta_base.outputs.package }}
          PACK_VERSION: ${{ steps.version.outputs.velopack_version }}
        run: |
          $full = "artifacts/velopack/Orayo-$env:PACK_VERSION-full.nupkg"
          $delta = "artifacts/velopack/Orayo-$env:PACK_VERSION-delta.nupkg"
          if (-not (Test-Path $delta)) { throw "The delta package was not generated." }
          vpk delta patch `
            --base $env:DELTA_BASE_PACKAGE `
            --patch $delta `
            --output artifacts/reconstructed.nupkg
          if ($LASTEXITCODE -ne 0) { throw "Reconstructing the delta package failed." }
          ./.github/scripts/Test-PackageContents.ps1 -Expected $full -Actual artifacts/reconstructed.nupkg
          $fullSize = (Get-Item $full).Length
          $deltaSize = (Get-Item $delta).Length
          "Delta: $deltaSize bytes; full: $fullSize bytes." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Velopack release
        shell: pwsh
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $repoUrl = "https://github.com/${{ github.repository }}"

          vpk upload github `
            --repoUrl $repoUrl `
            --token $env:VPK_TOKEN `
            --outputDir artifacts/velopack `
            --publish `
            --merge `
            --releaseName "Orayo $version" `
            --tag $version
          if ($LASTEXITCODE -ne 0) { throw "Uploading the release failed." }

      - name: Rename GitHub release downloads
        uses: actions/github-script@v8
        with:
          script: |
            const tagName = '${{ steps.version.outputs.version }}';
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tagName
            });

            const names = new Map([
              ['Orayo-win-Portable.zip', `Orayo-${tagName}-Portable.zip`],
              ['Orayo-win-Setup.exe', `Orayo-${tagName}-Setup.exe`]
            ]);

            for (const asset of release.data.assets) {
              const newName = names.get(asset.name);
              if (!newName) continue;

              await github.rest.repos.updateReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
                name: newName
              });
            }

      - name: Generate GitHub release notes
        id: release_notes
        uses: actions/github-script@v8
        with:
          script: |
            const tagName = '${{ steps.version.outputs.version }}';
            const generated = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              target_commitish: context.sha
            });

            core.setOutput('body', generated.data.body);

      - name: Update GitHub release notes
        uses: actions/github-script@v8
        with:
          script: |
            const tagName = '${{ steps.version.outputs.version }}';
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tagName
            });

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              body: ${{ toJson(steps.release_notes.outputs.body) }}
            });

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Orayo-${{ steps.version.outputs.version }}
          path: artifacts/velopack/*
          if-no-files-found: error
