name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 build
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      RUNTIME_ID: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Verify bundled runtime assets
        shell: pwsh
        run: |
          $requiredFiles = @(
            "src/Orayo/Assets/engine/xray.exe",
            "src/Orayo/Assets/engine/wintun.dll",
            "src/Orayo/Assets/rules/geoip.dat",
            "src/Orayo/Assets/rules/geosite.dat"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required bundled asset is missing: $file"
            }
          }

      - name: Test core behavior
        run: dotnet test tests/Orayo.Core.Tests/Orayo.Core.Tests.csproj -c Release

      - name: Restore
        run: dotnet restore src/Orayo/Orayo.csproj -r $env:RUNTIME_ID

      - name: Build
        run: dotnet build src/Orayo/Orayo.csproj -c Release -r $env:RUNTIME_ID --no-restore -p:WindowsAppSDKSelfContained=true
